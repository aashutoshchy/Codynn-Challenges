<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App by Ashutosh Chaudhary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <h1 id="heading">Quiz App<span> using HTML, CSS & JS only</span></h1>
        <div id="box">
            <h2 id="que-box"></h2>
            <div class="row">
                <input class="options" id="option1" type="radio" value="a" name="option">
                <label for="option1"></label>
            </div>
            <div class="row">
                <input class="options" id="option2" type="radio" value="b" name="option">
                <label for="option2"></label>
            </div>
            <div class="row">
                <input class="options" id="option3" type="radio" value="c" name="option">
                <label for="option3"></label>
            </div>
            <div class="row">
                <input class="options" id="option3" type="radio" value="d" name="option">
                <label for="option4"></label>
            </div>
            <button id="btn" onclick="submitQuiz()">Submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
